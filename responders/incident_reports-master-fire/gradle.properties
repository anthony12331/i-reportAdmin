# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure
android.useAndroidX=true
android.nonTransitiveRClass=true

# Fix for jlink.exe error on Windows:
# Disables the creation of a custom JDK image for compilation.
# This fixes the "Execution failed for JdkImageTransform" error.
android.jdk.image.generation.enabled=false
android.experimental.jdk.image.generation.enabled=false

# Optional: Ensure Gradle uses the embedded JBR if paths are problematic
# org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
